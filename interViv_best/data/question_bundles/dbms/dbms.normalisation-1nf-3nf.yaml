- bundle_id: dbms.normalisation-1nf-3nf
  version: 1
  category: technical_short_answer
  skill: DBMS
  topic: Normalisation
  difficulty: medium
  question: What is database normalisation? Explain 1NF, 2NF, 3NF.
  reference_answer: 'Normalisation eliminates data redundancy and ensures integrity. 1NF: each column
    holds atomic (indivisible) values and each row is unique. 2NF: in 1NF and every non-key column is
    fully functionally dependent on the whole primary key (eliminates partial dependencies). 3NF: in 2NF
    and no non-key column depends on another non-key column (eliminates transitive dependencies). BCNF
    is a stricter version of 3NF. Normalising reduces update anomalies but may require more JOINs.'
