question: What is a deadlock and how do databases handle it?
reference_answer: >-
  A deadlock occurs when two or more transactions each hold a lock that the other needs, creating a circular
  wait. Databases detect deadlocks using a wait-for graph (looking for cycles). Upon detection, the database
  selects a victim transaction (usually the one with the least cost to roll back), aborts it, and allows
  the others to proceed. Prevention strategies include acquiring locks in a consistent order and using
  lock timeouts. Optimistic concurrency avoids locks entirely.
