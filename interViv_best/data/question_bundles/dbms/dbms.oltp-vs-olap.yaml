question: What is the difference between OLTP and OLAP?
reference_answer: >-
  OLTP (Online Transaction Processing) handles many short, frequent read/write transactions typical of
  operational systems (orders, payments). Tables are normalised to avoid redundancy. OLAP (Online Analytical
  Processing) handles complex analytical queries over large historical datasets for reporting and BI.
  Tables are often denormalised (star/snowflake schema). OLTP optimises for throughput and low latency
  per transaction; OLAP optimises for query speed over large scans using columnar storage and data warehouses
  (Redshift, BigQuery, Snowflake).
