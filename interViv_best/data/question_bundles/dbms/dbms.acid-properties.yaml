- bundle_id: dbms.acid-properties
  version: 1
  category: technical_short_answer
  skill: DBMS
  topic: Transactions
  difficulty: easy
  question: What are ACID properties?
  reference_answer: ACID stands for Atomicity (a transaction fully succeeds or fully fails — no partial
    state), Consistency (a transaction brings the database from one valid state to another, maintaining
    all constraints), Isolation (concurrent transactions execute as if they were serial — intermediate
    states are hidden), and Durability (once committed, changes survive system failures). These properties
    ensure correctness and reliability of database transactions.
