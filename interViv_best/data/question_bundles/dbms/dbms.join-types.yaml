- bundle_id: dbms.join-types
  version: 1
  category: technical_short_answer
  skill: DBMS
  topic: SQL joins
  difficulty: easy
  question: What is a JOIN and explain the different types?
  reference_answer: A JOIN combines rows from two tables based on a related column. INNER JOIN returns
    rows where there is a match in both tables. LEFT JOIN returns all rows from the left table and matched
    rows from the right (NULLs for unmatched). RIGHT JOIN is the mirror. FULL OUTER JOIN returns all rows
    from both tables. CROSS JOIN is the Cartesian product. SELF JOIN joins a table with itself. Choose
    based on which unmatched rows you want to keep.
