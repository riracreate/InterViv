- bundle_id: dbms.isolation-levels
  version: 1
  category: technical_short_answer
  skill: DBMS
  topic: Transactions
  difficulty: hard
  question: What is a transaction isolation level?
  reference_answer: 'Isolation levels define how and when changes by one transaction are visible to others.
    Read Uncommitted: can see uncommitted changes (dirty reads). Read Committed: only sees committed data
    (default in many DBs). Repeatable Read: same rows return same data within a transaction (prevents
    non-repeatable reads but allows phantom reads). Serializable: fully serial execution, no anomalies.
    Higher isolation reduces anomalies but increases contention and may lower throughput.'
