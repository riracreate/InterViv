- bundle_id: python.shallow-vs-deep-copy
  version: 1
  category: technical_short_answer
  skill: Python
  topic: Object copying
  difficulty: medium
  question: What is the difference between shallow copy and deep copy?
  reference_answer: A shallow copy creates a new object but inserts references to the same child objects
    as the original. Modifying a mutable child object affects both copies. A deep copy recursively copies
    all nested objects, producing a fully independent clone. Use copy.copy() for shallow and copy.deepcopy()
    for deep copies. Shallow copies are faster and sufficient when nested objects are immutable or won't
    be mutated.
