- bundle_id: python.gil
  version: 1
  category: technical_short_answer
  skill: Python
  topic: Concurrency and the GIL
  difficulty: hard
  question: What is the GIL in CPython and what are its implications?
  reference_answer: The Global Interpreter Lock is a mutex in CPython that allows only one thread to execute
    Python bytecode at a time. It simplifies memory management by protecting reference counts, but it
    means CPU-bound multi-threaded Python programs cannot truly run in parallel on multiple cores. I/O-bound
    tasks can still benefit from threads because the GIL is released during I/O waits. For CPU-bound parallelism,
    multiprocessing or C extensions that release the GIL (like NumPy) are preferred.
