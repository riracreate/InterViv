  difficulty: medium
  question: What are Python generators and when would you use them?
  reference_answer: Generators are functions that use yield to produce a sequence of values lazily, one
    at a time, instead of building the entire sequence in memory. When called, a generator function returns
    a generator iterator. Each call to next() resumes execution until the next yield. They are ideal for
    large or infinite sequences, streaming data, and pipelines. Compared to list comprehensions, generator
    expressions use less memory.
