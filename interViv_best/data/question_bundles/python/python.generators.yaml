- bundle_id: python.generators
  version: 2
  category: technical_short_answer
  skill: Python
  topic: Iteration and generators
  difficulty: medium
  question: What are Python generators and when would you use them?
  reference_answer: Generators are functions that use yield to produce a sequence of values lazily, one
    at a time, instead of building the entire sequence in memory. When called, a generator function returns
    a generator iterator. Each call to next() resumes execution until the next yield. They are ideal for
    large or infinite sequences, streaming data, and pipelines. Compared to list comprehensions, generator
    expressions use less memory.
  acceptable_variants:
  - Generators yield items one at a time without storing the whole sequence.
  keywords:
  - generator
  - yield
  - lazy
  - iterator
  - memory
  required_concepts:
  - id: generator
    descriptor: Generator function/iterator that yields values
    aliases:
    - generators
    - generator function
    - generator iterator
    expected_propositions:
    - yield produces values lazily
    - generator returns an iterator
    positive_examples:
    - A generator uses yield to produce one value at a time.
    negative_cases:
    - Calling a generator builds the full list in memory.
  - id: yield
    descriptor: yield suspends and resumes generator execution
    aliases:
    - yielding
    expected_propositions:
    - yield pauses execution until next
    positive_examples:
    - next() resumes until the next yield
    negative_cases:
    - yield is the same as return
  - id: lazy_evaluation
    descriptor: Values computed on demand rather than all at once
    aliases:
    - lazy
    - lazily
    - on demand
    expected_propositions:
    - values are produced on demand
    positive_examples:
    - Streaming large files with a generator avoids loading everything.
    negative_cases:
    - Generators always allocate the full sequence first.
