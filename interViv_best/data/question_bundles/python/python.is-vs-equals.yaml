difficulty: easy
question: What is the difference between is and == in Python?
reference_answer: >-
  == tests value equality — whether two objects have the same content. is tests identity — whether two
  variables point to the exact same object in memory. For example, two lists with equal contents will
  pass == but fail is. The is operator is appropriate for comparing to singletons like None, True, and
  False, which have guaranteed single instances in CPython.
