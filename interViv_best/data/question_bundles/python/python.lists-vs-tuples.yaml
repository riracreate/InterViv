  question: Explain the difference between lists and tuples in Python.
  reference_answer: Lists are mutable ordered sequences defined with square brackets; tuples are immutable
    ordered sequences defined with parentheses. Because tuples are immutable they are hashable and can
    be used as dictionary keys or set members. Tuples are generally faster to iterate and use less memory.
    Use a list when you need to modify the collection; use a tuple when the data should not change.
