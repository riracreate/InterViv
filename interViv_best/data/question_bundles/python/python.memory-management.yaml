  version: 1
  category: technical_short_answer
  skill: Python
  topic: Memory management
  difficulty: hard
  question: How does Python's memory management work?
  reference_answer: 'CPython uses reference counting as the primary memory management strategy: every
    object tracks how many references point to it, and when the count drops to zero the memory is immediately
    freed. To handle reference cycles (A → B → A), CPython also runs a cyclic garbage collector. Memory
    is allocated from private heaps managed by CPython''s allocator, with small objects pooled for efficiency.
    The gc module exposes the cyclic collector and lets you trigger or tune collection.'
