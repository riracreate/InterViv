# interViv — Company Hiring Graphs
#
# DISCLAIMER (load-bearing, surfaced in UI and API responses):
# Company hiring profiles are curated from publicly available job descriptions,
# observed placement patterns, and industry references. These are reference
# profiles for practice preparation, not exact hiring criteria. Required
# levels and importance weights are interViv's curation, not the companies'
# stated rubric. Do not present these to users as authoritative recruiter data.
#
# Schema:
#   companies[].id                  -> stable string slug (used in URLs and DB seeding)
#   companies[].name                -> display name
#   companies[].logo_url            -> optional, may be null
#   companies[].public_info         -> free-form dict (careers URL, etc.)
#   companies[].roles[].id          -> stable string slug, unique within company
#   companies[].roles[].title       -> display title
#   companies[].roles[].level       -> "intern" | "entry" | "mid" (free text)
#   companies[].roles[].skill_requirements[].skill            -> canonical KG name
#   companies[].roles[].skill_requirements[].display_name     -> optional UI label
#   companies[].roles[].skill_requirements[].required_level   -> 0-100 target student score
#   companies[].roles[].skill_requirements[].importance_weight-> 0-1, sums to 1.0 per role
#
# Canonical skill names must match modules/knowledge_graph.py keys
# (DSA, OOP, DBMS, OS, CN, HR, System Design, Python, ML) so the scoring
# pipeline and gap analyser can join on them without aliasing.

disclaimer: "Company hiring profiles are curated from publicly available job descriptions, observed placement patterns, and industry references. These are reference profiles for practice preparation, not exact hiring criteria."

