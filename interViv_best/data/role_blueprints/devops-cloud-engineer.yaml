level_expectations:
  intern: Writes clean multi-stage Dockerfiles, explains Linux permissions/processes/ports,
    configures basic GitHub Actions/GitLab CI pipelines, and understands VPC subnets,
    security groups, and IAM least privilege.
  junior: Writes clean multi-stage Dockerfiles, explains Linux permissions/processes/ports,
    configures basic GitHub Actions/GitLab CI pipelines, and understands VPC subnets,
    security groups, and IAM least privilege.
  mid: Designs zero-downtime deployments (blue/green, canary), Infrastructure-as-Code
    state locking and drift remediation, secrets management, observability (metrics/logs/traces,
    SLOs), and structured incident response.
