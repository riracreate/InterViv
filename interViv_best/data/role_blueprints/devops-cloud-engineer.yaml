draft_seeds:
- kind: opener
  text: You containerized your web application with Docker and deployed it on AWS
    using a CI/CD pipeline. How did you pass production secrets into the container,
    and what happens right now if a broken build passes unit tests but crashes on
    startup?
- kind: fundamentals
  text: Why can a naive Node.js or Python Dockerfile end up over 1.2 GB and rebuild
    `npm install` or `pip install` on every single code edit, and how do layer ordering
    and multi-stage builds solve both problems?
- kind: tradeoff
  text: An application running in a private AWS VPC subnet suddenly fails to pull
    packages from an external HTTPS registry and cannot read objects from an S3 bucket
    in the same region. Walk through every VPC, routing, security-group/NACL, IAM,
    and VPC Endpoint layer you check—and why a Gateway VPC Endpoint is preferable
    to routing S3 traffic through a NAT Gateway.
- kind: scenario
  text: At 2:00 AM, alerts fire showing HTTP 502 errors spiking to 60% behind your
    Application Load Balancer right after an automated scaling event and config update.
    Disk space on two nodes is also at 99%. How do you stabilize service, isolate
    whether the config change or disk exhaustion is primary, and prevent recurrence?
- kind: behavioural
  text: Tell me about a time an automation script, configuration change, or deployment
    you worked on caused an unexpected failure—or nearly did. How did you catch or
    contain it, and what safeguard did you put in place?
