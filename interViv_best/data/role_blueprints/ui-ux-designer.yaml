id: ui-ux-designer
title: UI/UX Designer
aliases:
- Product Designer
- Interaction Designer
- UX Researcher & Designer
- Digital Designer
family: design
levels:
- intern
- junior
- mid
practical_track: none
status: draft
version: 1
level_expectations:
  intern: Conducts non-leading usability tests, applies visual hierarchy, spacing,
    and WCAG contrast/focus basics, designs empty/loading/error states, and uses Figma
    auto-layout and reusable components.
  junior: Conducts non-leading usability tests, applies visual hierarchy, spacing,
    and WCAG contrast/focus basics, designs empty/loading/error states, and uses Figma
    auto-layout and reusable components.
  mid: Structures design tokens and scalable component systems, balances user friction
    against business/technical constraints, synthesizes mixed qualitative + quantitative
    funnel evidence, and hands off developer-ready specs.
