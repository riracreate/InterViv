draft_seeds:
- kind: opener
  text: Walk me through one screen or flow from your portfolio where usability feedback
    forced you to throw away your initial layout. What specific behaviour did users
    exhibit during testing, and what changed in version 2?
- kind: fundamentals
  text: What makes a usability-test task prompt leading versus non-leading? Suppose
    you are testing a new 'Swap Interview Skill' button on a practice preview card—write
    a non-leading scenario prompt and list three behavioural signals you watch before
    asking follow-up questions.
- kind: tradeoff
  text: When building or extending a design system, how do you decide whether a product
    team's new UI need should become a variant on an existing shared component, a
    brand-new shared component, or a local one-off pattern—and how do semantic design
    tokens support dark mode and WCAG AA contrast?
- kind: scenario
  text: Analytics show 62% of mobile users abandon a 4-step resume-and-role setup
    form on Step 2, and 5 usability sessions reveal users are anxious about where
    their resume text goes and overwhelmed by 9 inputs on one screen. Engineering
    says backend endpoints cannot change this sprint. How do you redesign and validate
    the flow?
- kind: behavioural
  text: Tell me about a time engineering told you your design would take three weeks
    instead of three days to build. How did you compromise without sacrificing the
    core user experience?
