draft_seeds:
- kind: opener
  text: Walk me through a single user action in your full-stack project—from clicking
    Submit in the browser to committing the row in the database and updating the screen.
    Where could that flow fail halfway, and how does your app handle it?
- kind: fundamentals
  text: Why is client-side form validation never sufficient on its own, and what is
    the difference between stored XSS, CSRF, and an Insecure Direct Object Reference
    (IDOR) in a web app?
- kind: tradeoff
  text: Compare cursor-based pagination against LIMIT/OFFSET pagination for an infinite-scroll
    activity feed backed by PostgreSQL. What happens to both UI consistency and database
    query cost when new items are inserted at the top while the user scrolls to page
    50?
- kind: scenario
  text: 'You need to ship a collaborative ''Invite Teammate by Email'' feature end-to-end
    by Friday: UI modal, API endpoint, invitation token table, and email dispatch.
    How do you design the schema, API contract, failure handling if the email provider
    times out, and rollout steps?'
- kind: behavioural
  text: Tell me about a time you had to jump into an unfamiliar part of the stack—frontend,
    backend, or deployment—under a tight deadline. How did you get unblocked without
    breaking existing behaviour?
