version: 1
level_expectations:
  intern: Connects a React/JS frontend to a REST backend and relational DB, validates
    inputs on both client and server, handles authentication cookies/tokens safely,
    and writes basic SQL joins.
  junior: Connects a React/JS frontend to a REST backend and relational DB, validates
    inputs on both client and server, handles authentication cookies/tokens safely,
    and writes basic SQL joins.
  mid: Designs end-to-end data contracts, prevents XSS/CSRF/IDOR vulnerabilities,
    manages optimistic UI updates with server rollback, and debugs cross-boundary
    latency from browser network tab to DB query plan.
