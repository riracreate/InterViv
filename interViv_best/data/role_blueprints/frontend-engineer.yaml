draft_seeds:
- kind: opener
  text: In your dashboard project built with React, you managed filter and table state
    across multiple charts. Where did that state live, why did you choose that approach
    over URL query parameters or a global store, and what happened if the user refreshed
    the page?
- kind: fundamentals
  text: Explain how the JavaScript event loop schedules synchronous code, microtasks
    (Promise callbacks), and macrotasks (setTimeout). If a click handler queues both
    a Promise.then and a setTimeout(..., 0), in what order do they run relative to
    browser repaint?
- kind: tradeoff
  text: A React search input fires a fetch request on every keystroke. When a user
    types 'react' quickly, the response for 're' arrives after the response for 'react'
    and overwrites the UI with stale results. Compare debouncing alone versus AbortController
    / request-ID guards, and explain why debouncing by itself does not eliminate the
    race condition.
- kind: scenario
  text: Users in Tier-2 cities on mid-range Android phones report that your product
    listing page takes 8 seconds to become interactive and freezes when scrolling
    through 500 items, even though it feels fast on your laptop. How do you reproduce,
    measure, and fix this systematically?
- kind: behavioural
  text: Describe a time when a design mockup or product requirement looked straightforward
    at first, but turned out to have tricky edge cases once you started building the
    UI. How did you handle it with the designer or PM?
