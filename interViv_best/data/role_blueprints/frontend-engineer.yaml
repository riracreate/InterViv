  intern: Understands closures, the event loop, promises, semantic HTML, CSS flexbox/grid,
    controlled vs. uncontrolled React components, and basic API state handling (loading,
    error, empty).
  junior: Understands closures, the event loop, promises, semantic HTML, CSS flexbox/grid,
    controlled vs. uncontrolled React components, and basic API state handling (loading,
    error, empty).
  mid: Diagnoses unnecessary re-renders, bundle bloat, Core Web Vitals (LCP, INP,
    CLS), race conditions in async data fetching, keyboard/ARIA accessibility, and
    client caching.
