draft_seeds:
- kind: opener
  text: Pick a product or project you built or analyzed on your resume. Who was the
    exact target user, what feature did you intentionally leave out of version 1,
    and what metric would prove version 1 actually worked?
- kind: fundamentals
  text: You are launching a 'Quick Reorder' button in a campus food-delivery app.
    Define one primary success metric, two guardrail (counter) metrics, and explain
    why measuring 'total clicks on Quick Reorder' alone could mislead the team.
- kind: tradeoff
  text: Where does a formulaic RICE score break down when prioritizing a technical-debt
    refactor or trust-and-safety fix against a shiny growth feature, and how do you
    structure prioritization across buckets instead?
- kind: scenario
  text: You are the APM for an online test-prep platform with 3 engineers for the
    next 6-week cycle. Option A is an AI doubt-solver requested in 40% of support
    tickets; Option B is fixing the day-1 onboarding flow where 55% of new sign-ups
    drop off before taking their first diagnostic quiz. How do you evaluate both options
    and make a recommendation?
- kind: behavioural
  text: Tell me about a time an engineer or teammate pushed back strongly against
    an idea or scope you proposed. How did you respond, and what shipped in the end?
