level_expectations:
  intern: Segments users clearly, identifies real user pain points before jumping
    to UI features, defines a North Star plus guardrail metric, and writes structured
    PRDs/user stories.
  junior: Segments users clearly, identifies real user pain points before jumping
    to UI features, defines a North Star plus guardrail metric, and writes structured
    PRDs/user stories.
  mid: Weighs engineering effort, strategic moat, unit economics, and cannibalization
    risks; diagnoses funnel drops methodically; runs disciplined experiments and sprint
    trade-offs.
