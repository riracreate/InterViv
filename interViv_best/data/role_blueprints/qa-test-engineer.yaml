draft_seeds:
- kind: opener
  text: In your automated test suite, what was the flakiest test you encountered—one
    that sometimes passed and sometimes failed without code changes—and how did you
    diagnose and fix it?
- kind: fundamentals
  text: A coupon input accepts discount percentages between 5% and 50% (integers only)
    for cart totals above INR 500, up to 3 uses per customer. Using equivalence partitioning
    and boundary-value analysis, list the minimal high-signal test cases you would
    design, including negative cases.
- kind: tradeoff
  text: Why does sprinkling `time.sleep(5)` throughout UI automation tests both slow
    down CI and still leave tests flaky under load, and what combination of explicit
    condition waits, test-data isolation, and API-level setup should replace it?
- kind: scenario
  text: A hotfix touching checkout tax calculation and promo codes must ship in 2
    hours, but your full regression suite takes 90 minutes and 4 E2E tests are currently
    failing on an unrelated staging environment issue. What do you test, what do you
    skip, and what exact go/no-go evidence do you hand the release lead?
- kind: behavioural
  text: Tell me about a time a developer or manager wanted to close a bug as 'minor'
    or 'works on my machine,' and you believed it would hurt real users. How did you
    make your case?
