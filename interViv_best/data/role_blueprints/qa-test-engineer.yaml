id: qa-test-engineer
title: QA / Test Engineer
aliases:
- SDET
- Automation Test Engineer
- Quality Assurance Analyst
family: engineering
levels:
- intern
- junior
- mid
practical_track: coding
status: draft
version: 1
level_expectations:
  intern: Applies equivalence partitioning and boundary-value analysis, distinguishes
    unit/integration/E2E tests, writes reproducible bug reports, and scripts clean
    API or UI assertions in Python/JS.
  junior: Applies equivalence partitioning and boundary-value analysis, distinguishes
    unit/integration/E2E tests, writes reproducible bug reports, and scripts clean
    API or UI assertions in Python/JS.
  mid: Eliminates flaky E2E tests, designs contract and database-state assertions,
    builds risk-based regression suites inside CI pipelines, and evaluates release
    readiness under time pressure.
