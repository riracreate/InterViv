draft_seeds:
- kind: opener
  text: In your ML project on your resume, what was the simplest non-ML or heuristic
    baseline you compared your model against, how did you split train and validation
    data, and where did your model still fail?
- kind: fundamentals
  text: A fraud-detection dataset has 0.4% fraudulent transactions. A candidate preprocesses
    the entire dataset with `StandardScaler` and `SMOTE`, runs random 5-fold cross-validation,
    and reports 99.6% accuracy. Identify at least three methodological errors in this
    pipeline and how to fix each one.
- kind: tradeoff
  text: Compare L1/L2-regularized Logistic Regression, Gradient Boosted Decision Trees
    (XGBoost/LightGBM), and a fine-tuned Transformer when building a tabular + short-text
    ticket routing classifier with 15,000 labeled rows and a 30 ms CPU latency budget.
- kind: scenario
  text: Your loan-default model achieved 0.86 ROC-AUC on held-out historical data,
    but three weeks after launch in a new customer segment, default rates among approved
    users are twice what offline validation predicted. Walk through your diagnostic
    checklist.
- kind: behavioural
  text: Tell me about a time you spent significant effort on a model, feature, or
    hypothesis that failed to beat the baseline. How did you decide when to stop and
    pivot?
