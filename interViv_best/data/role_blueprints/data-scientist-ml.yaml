id: data-scientist-ml
title: Data Scientist / ML Engineer
aliases:
- Junior Data Scientist
- Applied AI/ML Engineer
- ML Associate
- Decision Scientist
family: data
levels:
- intern
- junior
- mid
practical_track: coding
status: draft
version: 1
level_expectations:
  intern: Prevents train/test data leakage, chooses proper metrics for imbalanced
    classes (PR-AUC, F1, calibration vs. accuracy), explains bias-variance, regularization,
    and tree vs. linear models, and writes clean Python/NumPy/pandas code.
  junior: Prevents train/test data leakage, chooses proper metrics for imbalanced
    classes (PR-AUC, F1, calibration vs. accuracy), explains bias-variance, regularization,
    and tree vs. linear models, and writes clean Python/NumPy/pandas code.
  mid: Designs temporal/grouped cross-validation, compares against simple deterministic
    baselines, handles feature drift/label delay in production, optimizes inference
    latency/cost, and aligns offline metrics with business KPIs.
