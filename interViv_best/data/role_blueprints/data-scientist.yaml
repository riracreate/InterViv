practical_track: coding
status: draft
version: 1
level_expectations:
  intern: Prevents train/test leakage, selects appropriate metrics for skewed outcomes
    (PR-AUC, RMSE vs. MAE, log-loss), computes sample sizes and p-values accurately,
    and writes clean Python/SQL exploratory pipelines.
  junior: Prevents train/test leakage, selects appropriate metrics for skewed outcomes
    (PR-AUC, RMSE vs. MAE, log-loss), computes sample sizes and p-values accurately,
    and writes clean Python/SQL exploratory pipelines.
  mid: Designs randomized controlled experiments with variance reduction (CUPED/stratification),
    handles novelty/network interference and observational causal pitfalls, calibrates
    predicted probabilities for decision thresholds, and translates uncertainty to
    executives.
