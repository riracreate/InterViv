draft_seeds:
- kind: opener
  text: In the predictive or analytical project on your resume, what specific business
    decision did your model or statistical analysis change, what simple heuristic baseline
    did you compare it against, and how did you validate it was not overfitting?
- kind: fundamentals
  text: Product runs an A/B test on checkout button copy and checks the p-value every
    morning, stopping the test on Day 4 as soon as p = 0.038. Explain why peeking inflates
    false positives, how you calculate required sample size upfront, and what Sample
    Ratio Mismatch (SRM) indicates.
- kind: tradeoff
  text: Marketing wants to measure whether sending a 15% discount push notification
    reduces 30-day churn, but legal/ops refused a holdout group last quarter, so you
    only have historical observational logs showing recipients churned 4% less than
    non-recipients. Why is that 4% estimate likely biased, and how would propensity
    weighting or difference-in-differences address or fail to address it?
- kind: scenario
  text: An A/B test of an algorithmic course-recommendation carousel increases click-through
    rate by 18% (p < 0.001), leaves 7-day course completion flat, and slightly increases
    48-hour unsubscribes by 0.4% (p = 0.09). Leadership wants to ship immediately based
    on the 18% CTR win. How do you advise them?
- kind: behavioural
  text: Tell me about a time your data or experiment disproved a hypothesis that a senior
    stakeholder or teammate was excited about. How did you validate your numbers and
    deliver the message?
