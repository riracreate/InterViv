draft_seeds:
- kind: resume-project-opener-unscored-coaching
  text: In your e-commerce backend project, you used JWT authentication and Redis
    caching. Why did you cache product listings in Redis instead of relying on PostgreSQL
    indexes, and how did you prevent stale prices when an admin updated inventory?
- kind: core-technical-fundamentals-intern-junior-or-missing-skill
  text: What makes an HTTP method idempotent, why is PUT considered idempotent while
    POST typically is not, and how would you prevent duplicate charges if a client
    retries a POST /payments request after a network timeout?
- kind: core-technical-deep-trade-off-mid-or-claimed-skill
  text: Two concurrent transactions read a user's wallet balance of 500, verify sufficient
    funds, and each deduct 400. Which SQL isolation phenomena is occurring, why does
    Read Committed fail to stop it without explicit locking, and how do SELECT FOR
    UPDATE vs. optimistic concurrency version columns trade off under high contention?
- kind: role-scenario-situational-scored
  text: Ten minutes after deploying a minor release to the order-history service,
    p95 API latency jumps from 120 ms to 4.2 seconds and database CPU hits 98%, though
    error rates are still below 1%. Walk through your first 15 minutes of triage and
    how you decide between rolling back and debugging live.
- kind: behavioural
  text: Tell me about the hardest bug or system failure you had to track down in a
    project or internship where your first hypothesis turned out to be wrong. How
    did you narrow down the real cause, and what changed afterward?
- kind: non-leading-follow-up-probe
  text: What specific instrumentation or test did you personally add so that class
    of bug would be caught before deployment?
