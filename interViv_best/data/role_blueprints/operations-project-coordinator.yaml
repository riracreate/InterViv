draft_seeds:
- kind: opener
  text: Tell me about a multi-person project, campus fest, or internship workflow
    you coordinated where deliverables depended on people who did not report to you.
    How did you track progress and prevent last-minute surprises?
- kind: fundamentals
  text: Explain the critical path in a project schedule and the RACI framework. Why
    does assigning two people as 'Accountable' for the same milestone almost always
    cause delays, and what is the difference between a Risk and an Issue in a RAID
    log?
- kind: tradeoff
  text: An operational onboarding team processes 120 client requests a week, but average
    turnaround time has crept from 2 days to 7 days even though headcount stayed constant.
    How do you diagnose whether this is capacity overload, WIP thrashing, or upstream
    input defects?
- kind: scenario
  text: A client-facing product rollout is scheduled in 10 business days. Today, the
    QA lead tells you testing hasn't started because Backend is 4 days late on an
    integration, while Marketing has already scheduled customer webinars for launch
    day. Walk through your exact next 24 hours.
- kind: behavioural
  text: Describe a time when an important deliverable you were coordinating fell behind
    because a teammate or external partner missed their deadline. How did you handle
    the conversation and recover the timeline?
