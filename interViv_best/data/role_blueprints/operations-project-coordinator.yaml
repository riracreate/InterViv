practical_track: none
status: draft
version: 1
level_expectations:
  intern: Maintains accurate action trackers with single-threaded owners and due dates,
    maps task dependencies, flags blockers early, and writes crisp status updates.
  junior: Maintains accurate action trackers with single-threaded owners and due dates,
    maps task dependencies, flags blockers early, and writes crisp status updates.
  mid: Manages critical-path trade-offs (scope, schedule, resources), maintains RAID
    logs (Risks, Assumptions, Issues, Dependencies), standardizes repeatable SOPs,
    and resolves cross-team bottlenecks calmly.
level_expectation_review:
