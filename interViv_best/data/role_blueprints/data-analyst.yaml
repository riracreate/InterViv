draft_seeds:
- kind: opener
  text: In your sales or customer-churn analytics project, which single metric or
    chart changed your conclusion the most once you cleaned the raw dataset, and what
    was broken in the raw data before you cleaned it?
- kind: fundamentals
  text: You join an `orders` table (1,000 rows totaling INR 10,00,000) to an `order_items`
    table and an `order_discounts` table, and your `SUM(orders.total_amount)` suddenly
    jumps to INR 28,00,000. Why did this happen, and how do you fix the query without
    losing item-level or discount-level filters?
- kind: tradeoff
  text: Overall conversion rate on your checkout flow dropped from 5.2% last month
    to 4.7% this month, yet conversion rate actually increased slightly on both Desktop
    and Mobile when viewed separately. How is this mathematically possible, and what
    follow-up cuts would you run before telling leadership checkout is broken?
- kind: scenario
  text: Thirty minutes before a quarterly review, the VP of Marketing says her campaign
    dashboard shows 14,200 new sign-ups last month, while Finance's revenue report
    shows only 11,600. Both teams claim their query is right. Walk through how you
    audit and reconcile the gap.
- kind: behavioural
  text: Tell me about a time you spotted an error in an analysis, report, or dataset—especially
    if someone had already seen the earlier numbers. How did you handle communicating
    the correction?
