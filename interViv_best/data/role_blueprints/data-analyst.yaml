id: data-analyst
title: Data Analyst
aliases:
- BI Analyst
- Business Data Analyst
- Product/Decision Analyst
- Analytics Associate
family: data
levels:
- intern
- junior
- mid
practical_track: sql
status: draft
version: 1
level_expectations:
  intern: Writes accurate `LEFT JOIN`, `GROUP BY`, `HAVING`, and `CASE` queries without
    fan-out bugs, distinguishes mean vs. median and correlation vs. causation, and
    picks clear chart types.
  junior: Writes accurate `LEFT JOIN`, `GROUP BY`, `HAVING`, and `CASE` queries without
    fan-out bugs, distinguishes mean vs. median and correlation vs. causation, and
    picks clear chart types.
  mid: Uses CTEs and window functions (`ROW_NUMBER`, `LAG`, rolling windows), defines
    unambiguous product/finance metrics, detects Simpson's paradox and selection bias,
    and resolves cross-team metric discrepancies.
