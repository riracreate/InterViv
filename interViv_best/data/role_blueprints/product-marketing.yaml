draft_seeds:
- kind: opener
  text: Tell me about a campaign, club event, product launch, or research project
    on your resume where you had to convince a specific audience to take action. How
    did you choose the core message, and how did you know which channel actually drove
    sign-ups?
- kind: fundamentals
  text: 'What is the difference between product positioning, messaging, and a tagline?
    Take a technical feature like ''client-side browser webcam processing with zero
    video upload'' and write positioning + messaging for two distinct personas: (1)
    a college student practicing interviews in a hostel, and (2) a university placement
    director.'
- kind: tradeoff
  text: Why do survey questions like 'Would you pay INR 499/month for this AI coach?'
    systematically overestimate willingness to pay, and what research methods or behavioral
    tests produce more reliable pricing and demand signals?
- kind: scenario
  text: Your B2B SaaS workflow tool is launching a new automated reporting add-on
    in 4 weeks, and simultaneously your main competitor just made their basic reporting
    tier free ([Google re:Work](https://rework.withgoogle.com/intl/en/guides/a-guide-to-structured-interviewing-for-better-hiring-practices?hl=en-US)).
    How do you structure the launch tier, sharpen your differentiation, enable the
    sales team, and measure 30-day success?
- kind: behavioural
  text: Describe a time a launch, event, or content piece fell short of your initial
    goal. How did you diagnose whether the audience, channel, or message was wrong?
