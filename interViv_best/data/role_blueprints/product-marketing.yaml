practical_track: none
status: draft
version: 1
level_expectations:
  intern: Distinguishes product features from user benefits, identifies Ideal Customer
    Profiles (ICPs) and competitive alternatives, writes clear value propositions,
    and understands CAC, conversion rate, and activation funnels.
  junior: Distinguishes product features from user benefits, identifies Ideal Customer
    Profiles (ICPs) and competitive alternatives, writes clear value propositions,
    and understands CAC, conversion rate, and activation funnels.
  mid: Designs tiered Go-To-Market (GTM) launches (Tier 1 vs. Tier 3), equips sales/support
    teams with battlecards, runs win/loss and pricing research, and attributes pipeline/adoption
    impact accurately.
