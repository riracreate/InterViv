draft_seeds:
- kind: opener
  text: Tell me about a project or internship where a stakeholder asked for a specific
    report, dashboard, or feature, and once you dug into their workflow you realized
    they actually needed something different. How did you uncover that?
- kind: fundamentals
  text: What is the difference between a functional requirement, a non-functional
    requirement, and an acceptance criterion? Rewrite the vague request 'Make customer
    refund approvals faster' into one crisp user story, two measurable non-functional
    requirements, and three Given/When/Then acceptance criteria including an exception
    path.
- kind: tradeoff
  text: When mapping an 'as-is' order-to-cash workflow across CRM, ERP, and Support
    tools, how do you distinguish an automation problem from a broken policy/handoff
    problem—and why can automating an unstandardized process make error rates worse?
- kind: scenario
  text: Sales wants one-click instant onboarding with only a phone number to boost
    sign-ups, while Compliance/Finance insists on mandatory PAN/GST verification and
    manual approval before any account is created. Engineering has capacity for one
    unified flow this quarter. How do you facilitate alignment and propose a solution?
- kind: behavioural
  text: Describe a situation where two stakeholders gave you contradictory instructions
    or priorities on the same deliverable. How did you get them to agree without simply
    escalating everything?
