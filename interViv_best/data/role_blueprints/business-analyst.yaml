level_expectations:
  intern: Writes clear user stories with testable acceptance criteria (Given/When/Then),
    maps current-state ("as-is") vs. future-state ("to-be") workflows, and writes
    clean SQL aggregations/joins to size business problems.
  junior: Writes clear user stories with testable acceptance criteria (Given/When/Then),
    maps current-state ("as-is") vs. future-state ("to-be") workflows, and writes
    clean SQL aggregations/joins to size business problems.
  mid: Uncovers hidden non-functional and regulatory constraints, quantifies ROI/cost-benefit
    trade-offs, mediates conflicting departmental requirements, and designs UAT sign-off
    plans.
