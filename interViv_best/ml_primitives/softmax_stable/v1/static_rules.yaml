# PHASEX_RULE_INTERNAL_softmax_stable
imports:
  name: approved dependencies
  allow:
    - numpy
rules:
  - name: unshifted exponentiation
    kind: call_on_unshifted_input
    calls: ["numpy.exp"]
    inputs: ["logits"]
    reductions: ["numpy.max"]
    reduction_methods: ["max"]
  - name: batch axis loop
    kind: for_over_axis
    arrays: ["logits"]
