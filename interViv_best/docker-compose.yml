services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: interviv
      POSTGRES_USER: interviv
      POSTGRES_PASSWORD: interviv
    ports:
      - "5432:5432"
    volumes:
      - interviv_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interviv -d interviv"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - interviv_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://interviv:interviv@postgres:5432/interviv
      JWT_SECRET_KEY: local-dev-change-me
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      REDIS_URL: redis://redis:6379/0
      QUESTION_CACHE_TTL_SECONDS: 86400
      QUESTION_LLM_MAX_RETRIES: 3
      QUESTION_LLM_RATE_LIMIT_PER_MINUTE: 60
      QUESTION_LLM_PROVIDER: openrouter
      OPENROUTER_MODEL: anthropic/claude-haiku-4.5
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn backend.main:app --host 0.0.0.0 --port 8000"

volumes:
  interviv_postgres:
  interviv_redis:
