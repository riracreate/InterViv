name: Verify InterViv

on:
  pull_request:
  push:
    branches: [main, publish-ready-phase4c, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  ENVIRONMENT: development
  DATABASE_URL: ''
  REDIS_URL: ''
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
  LLM_LIVE_FETCH: '0'
  JOBS_LIVE_FETCH: '0'
  JWT_SECRET_KEY: ci-test-key-with-at-least-32-characters

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: interViv_best
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'interViv_best/requirements*.txt'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q -rs

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: interViv_best/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'interViv_best/requirements*.txt'
      # Frontend contract tests ask the real backend to produce test payloads.
      - run: python -m pip install -r ../requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: interViv_best/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: interviv
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: interviv_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U interviv -d interviv_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      INTERVIV_TEST_DATABASE_URL: postgresql+psycopg://interviv:ci-only-password@127.0.0.1:5432/interviv_test
    defaults:
      run:
        working-directory: interViv_best
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'interViv_best/requirements*.txt'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_session_write_races.py tests/test_follow_up_allocation.py tests/test_phase4b_sql_persistence.py tests/test_phase3a_persistence.py tests/test_overhaul_persistence.py

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f interViv_best/backend/Dockerfile -t interviv-check interViv_best
      - name: Check packaged practice content and migrated readiness
        run: >-
          docker run --rm
          -e ENVIRONMENT=development
          -e DATABASE_URL=sqlite:////tmp/interviv-smoke.db
          -e HF_HUB_OFFLINE=1
          -e TRANSFORMERS_OFFLINE=1
          interviv-check sh -ec 'alembic upgrade head;
          python -c "from backend.readiness import readiness_status; ready, result = readiness_status(); print(result); assert ready"'
